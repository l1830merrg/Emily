    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        
        :root {
            --muji-red: #7F2122;
            --muji-beige: #F7F2ED;
            --muji-text: #333333;
            --muji-gray: #7F7F7F;
            --muji-border: #E0E0E0;
            --line-green: #06C755;
            --desc-color: #778899;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--muji-beige);
            color: var(--muji-text);
            scroll-behavior: smooth;
        }

        input, select, textarea {
            background-color: #FFFFFF !important;
            border: 1px solid var(--muji-border) !important;
            border-radius: 2px !important;
            padding: 16px !important;
            font-size: 16px !important;
        }

        .sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar-closed { transform: translateX(-100%); }

        .submenu { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
        .submenu.open { max-height: 1200px; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .product-card { background: white; transition: all 0.3s ease; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .muji-checkbox:checked { background-color: var(--muji-red); border-color: var(--muji-red); }
        .img-nav-btn { opacity: 0; transition: opacity 0.2s ease; }
        .group:hover .img-nav-btn { opacity: 1; }
        .dot { transition: all 0.3s ease; }

        .brand-section-header {
            grid-column: 1 / -1;
            margin-top: 50px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--muji-border);
            padding-bottom: 20px;
            scroll-margin-top: 160px;
        }
        .brand-section-title { font-size: 24px; letter-spacing: 0.15em; font-weight: 500; margin-bottom: 8px; color: #1a1a1a; }
        .brand-section-desc { font-size: 15px; color: var(--desc-color); letter-spacing: 0.05em; line-height: 1.8; font-weight: 400; }

        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.9);
            z-index: 500;
            align-items: center;
            justify-content: center;
        }

        .nav-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: white;
            border: 1px solid var(--muji-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 100;
            min-width: 220px;
        }
        .nav-item-container:hover .nav-dropdown {
            display: block;
        }
    </style>
</head>

        function scrollToSection(brand, subcat) {

        }

        function renderProducts() {
            const grid = document.getElementById('product-grid'); grid.innerHTML = '';
            if (currentFilter === "茅乃舍" || currentFilter === "好市多") {
                const cats = currentFilter === "茅乃舍" ? KAYANOYA_CATEGORIES : COSTCO_CATEGORIES;

                    const prods = allProducts.filter(p => p.brand === currentFilter && p.subcat === sub);

                        const header = document.createElement('div'); header.id = `section-${sub}`; header.className = 'brand-section-header fade-in';

                const filtered = currentFilter === "全部" ? allProducts : allProducts.filter(p => p.brand === currentFilter);

        function createProductCard(p) {

                <div id="dots-${p.id}" class="absolute bottom-5 left-1/2 -translate-x-1/2 flex space-x-2.5">${p.images.map((_, i) => `<div class="dot w-2.5 h-2.5 rounded-full ${i === currentImgIdx ? 'bg-white scale-125' : 'bg-white/40'}"></div>`).join('')}</div>` : ''}

                <p class="text-base text-[#778899] font-medium leading-loose">${p.desc}</p>

                    </select>
                </div>
            </div>`;
            return card;
        }

        function switchCardImage(productId, direction) {
            const product = allProducts.find(p => p.id === productId); const max = product.images.length;

            const img = document.getElementById(`img-${productId}`); if (img) { img.style.opacity = '0.5'; setTimeout(() => { img.src = product.images[newIdx]; img.style.opacity = '1'; }, 100); }
            const dots = document.getElementById(`dots-${productId}`); if (dots) { [...dots.children].forEach((dot, i) => dot.className = `dot w-2.5 h-2.5 rounded-full ${i === newIdx ? 'bg-white scale-125' : 'bg-white/40'}`); }

        function updateCart(id, qty) { cart[id] = parseInt(qty); if (cart[id] === 0) delete cart[id]; updateSummary(); }

        function updateSummary() {

            const allChecked = [...document.querySelectorAll('.terms-checkbox')].every(cb => cb.checked);
            const infoComplete = ['input-name', 'input-line', 'input-email', 'input-shipping'].every(id => document.getElementById(id).value.trim() !== "");
            list.innerHTML = ''; let total = 0, count = 0;
            for (let id in cart) {
                const p = allProducts.find(item => item.id == id); if(!p) continue;
                const subtotal = p.price * cart[id]; total += subtotal; count++;
                list.innerHTML += `<div class="flex justify-between tracking-wide text-xl"><span class="text-gray-600">${p.name} / ${cart[id]} 個</span><span class="font-bold">NT$ ${subtotal.toLocaleString()}</span></div>`;

            sum.classList.toggle('hidden', count === 0);
            if (count > 0 && allChecked && infoComplete) { submitBtn.disabled = false; tip.textContent = ""; }
            else { submitBtn.disabled = true; if (count === 0) tip.textContent = ""; else if (!allChecked) tip.textContent = "請勾選所有代購須知條款"; else tip.textContent = "請填寫完整訂購資訊"; }
            totalDisplay.textContent = `NT$ ${total.toLocaleString()}`; mobileTotal.textContent = `NT$ ${total.toLocaleString()}`;
        }

        document.getElementById('orderForm').onsubmit = async function(e) {
            e.preventDefault();
            if (!SCRIPT_URL) { alert("尚未設定後台串接位址。"); return; }
            const orderId = "EM" + Date.now(); 
            document.getElementById('loadingOverlay').style.display = 'flex';
            let itemsStr = "";
            for (let id in cart) {
                const p = allProducts.find(item => item.id == id);
                itemsStr += `${p.name} x ${cart[id]}\n`;
            }
            const data = { orderId, name: document.getElementById('input-name').value, lineId: document.getElementById('input-line').value, email: document.getElementById('input-email').value, shipping: document.getElementById('input-shipping').value, notes: document.getElementById('input-notes').value, orderItems: itemsStr, total: document.getElementById('grand-total').textContent };
            try {
                await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", cache: "no-cache", body: JSON.stringify(data) });
                document.getElementById('display-order-id').textContent = orderId;
                document.getElementById('loadingOverlay').style.display = 'none';
                document.getElementById('successToast').classList.remove('hidden');
                this.reset(); cart = {}; updateSummary();
            } catch (err) {
                document.getElementById('loadingOverlay').style.display = 'none';
                alert("送出失敗，請檢查網路連線或稍後再試。");
            }
        };
    </script>
</body>
</html>
